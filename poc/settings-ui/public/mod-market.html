<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="color-scheme" content="dark" />
        <title>模组市场</title>
        <style>
            /* Before the bundle runs: the same dark ground the panel paints itself on, so the window
             * does not flash white between navigation and React's first commit. */
            html, body { height: 100%; margin: 0; background: #111113; color: #f4f4f5; }
            #root { height: 100%; }
        </style>
    </head>
    <body>
        <!-- 市场专用窗口的宿主页（issue #23 第二轮）。
             `#root` 是**必需的**：`mount.tsx` 的注入路径只往 body 里 append 容器，只有非注入路径
             （dev.html / 这个页面）才会去找 `#root`。没有它，页面挂载后是一片空白。

             这里**故意不写任何模块标签**，也不该写：宿主用 `--settings-entry` 把 `settings-ui.js`
             注入到**任何**文档（`HostForm.cs` 的 settings-inject），由 `main.tsx` 里的
             `isMarketWindow()` 分支决定只挂市场面板。多一个入口会让 vite 产出第二个
             `settings-ui.js`（`entryFileNames` 是固定字符串），而 stage/verify 都按「恰好一个」
             工作。 -->
        <div id="root"></div>
    </body>
</html>
